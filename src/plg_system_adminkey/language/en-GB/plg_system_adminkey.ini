PLG_SYSTEM_ADMINKEY="System - Admin Secret Key"
PLG_SYSTEM_ADMINKEY_XML_DESCRIPTION="Protects the Joomla administrator panel by requiring a secret word in the URL on first access. Once verified, the session is marked and the key is not required again until the session expires."

; Params — usage note
PLG_SYSTEM_ADMINKEY_USAGE_LABEL="How to use"
PLG_SYSTEM_ADMINKEY_USAGE_DESC="<strong>Setup:</strong> enter a secret key below, save, and enable the plugin.<br><strong>Access:</strong> open <code>/administrator/?yourkey</code> — add <code>?yourkey</code> as a query parameter with no value.<br><strong>Session:</strong> once verified, you will not need the key again until your admin session expires or you log out.<br><strong>Lockout recovery:</strong> if you get locked out, disable the plugin via FTP — open <code>plugins/system/adminkey/adminkey.php</code> and add <code>return;</code> at the start of <code>onAfterInitialise()</code>, or rename the plugin folder to disable it.<br><strong>Tip:</strong> use a long random key (e.g. <code>xK9!mQ3v</code>) — avoid dictionary words."

; Params — secret key field
PLG_SYSTEM_ADMINKEY_KEY_LABEL="Secret key"
PLG_SYSTEM_ADMINKEY_KEY_DESC="The word or phrase added to the admin URL as a query parameter. Example: if you set <code>mySecret</code>, access admin via <code>/administrator/?mySecret</code>. Leave empty to disable protection."
PLG_SYSTEM_ADMINKEY_KEY_HINT="e.g. xK9mQ3v (use something hard to guess)"

; Params — redirect URL field
PLG_SYSTEM_ADMINKEY_REDIRECT_LABEL="Redirect URL"
PLG_SYSTEM_ADMINKEY_REDIRECT_DESC="Where to send visitors who try to access <code>/administrator/</code> without the key. Leave empty to redirect to the site homepage."
PLG_SYSTEM_ADMINKEY_REDIRECT_HINT="https://example.com (default: site homepage)"
