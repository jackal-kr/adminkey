PLG_SYSTEM_ADMINKEY="System - Tajny Klucz Admina"
PLG_SYSTEM_ADMINKEY_XML_DESCRIPTION="Chroni panel administratora Joomla wymagając tajnego słowa w adresie URL przy pierwszym dostępie. Po weryfikacji sesja jest oznaczana i klucz nie jest wymagany do czasu wygaśnięcia sesji."

PLG_SYSTEM_ADMINKEY_USAGE_LABEL="Jak używać"
PLG_SYSTEM_ADMINKEY_USAGE_DESC="<strong>Konfiguracja:</strong> wpisz tajny klucz poniżej, zapisz i włącz wtyczkę.<br><strong>Dostęp:</strong> otwórz <code>/administrator/?twójklucz</code> — dodaj <code>?twójklucz</code> jako parametr URL bez wartości.<br><strong>Sesja:</strong> po weryfikacji klucz nie jest wymagany do wygaśnięcia sesji lub wylogowania.<br><strong>Odblokowanie:</strong> jeśli zostaniesz zablokowany, wyłącz wtyczkę przez FTP — otwórz <code>plugins/system/adminkey/adminkey.php</code> i dodaj <code>return;</code> na początku metody <code>onAfterInitialise()</code>, lub zmień nazwę folderu wtyczki.<br><strong>Wskazówka:</strong> używaj długiego losowego klucza (np. <code>xK9!mQ3v</code>) — unikaj słów słownikowych."

PLG_SYSTEM_ADMINKEY_KEY_LABEL="Tajny klucz"
PLG_SYSTEM_ADMINKEY_KEY_DESC="Słowo lub fraza dodawana do adresu URL panelu admina jako parametr zapytania. Przykład: jeśli ustawisz <code>mojKlucz</code>, wejdź do admina przez <code>/administrator/?mojKlucz</code>. Zostaw puste, aby wyłączyć ochronę."
PLG_SYSTEM_ADMINKEY_KEY_HINT="np. xK9mQ3v (użyj czegoś trudnego do odgadnięcia)"

PLG_SYSTEM_ADMINKEY_REDIRECT_LABEL="URL przekierowania"
PLG_SYSTEM_ADMINKEY_REDIRECT_DESC="Gdzie przekierować odwiedzających, którzy próbują wejść do <code>/administrator/</code> bez klucza. Zostaw puste, aby przekierować na stronę główną witryny."
PLG_SYSTEM_ADMINKEY_REDIRECT_HINT="https://example.com (domyślnie: strona główna)"
